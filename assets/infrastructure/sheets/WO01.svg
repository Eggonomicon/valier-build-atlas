ke="none" stroke-width="1"/><text x="1490" y="245" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Local work envelope</text><text x="1490" y="288" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">X98..115, Z118..143; civil levels -10..0. Later tile envelopes overlap old</text><text x="1490" y="322" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">ones; only this order's newly assigned cells are counted.</text><text x="1490" y="384" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Purpose</text><text x="1490" y="427" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">Establish the first access module, its landing and the west-gallery</text><text x="1490" y="461" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">connection. Follow exact slab/ support layers; the open well is not a</text><text x="1490" y="495" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">trapdoor.</text><text x="1490" y="557" fill="#71cfdc" font-family="Segoe UI" font-size="27" font-weight="600" dominant-baseline="hanging">PERMANENT STOCK / ITEMS</text><text x="1490" y="600" fill="#e2eef4" font-family="Segoe UI" font-size="27" font-weight="600" dominant-baseline="hanging">Ordinary stone slabs: 54</text><text x="1490" y="637" fill="#9ebfce" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging">0 full stacks + 54 items</text><text x="1490" y="687" fill="#e2eef4" font-family="Segoe UI" font-size="27" font-weight="600" dominant-baseline="hanging">Stone bricks: 1,964</text><text x="1490" y="724" fill="#9ebfce" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging">30 full stacks + 44 items</text><text x="1490" y="774" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Temporary cap handover</text><text x="1490" y="817" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">Add 60 / remove 0 / leave 60 in the end state. Coordinates are in the</text><text x="1490" y="851" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">separate cap CSV files; none is a permanent city placement.</text><text x="1490" y="913" fill="#71cfdc" font-family="Consolas" font-size="22" font-weight="400" dominant-baseline="hanging">LAYER  /  NEW BLOCKS  /  CLEAR CELLS</text><text x="1500" y="951" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging">-10       347            0</text><text x="1500" y="979" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging"> -9       154          193</text><text x="1500" y="1007" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging"> -8       148          199</text><text x="1500" y="1035" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging"> -7       142          205</text><text x="1500" y="1063" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging"> -6       136          211</text><text x="1500" y="1091" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging"> -5       130          217</text><text x="1500" y="1119" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging"> -4       314           33</text><text x="1500" y="1147" fill="#e2eef4" font-family="Consolas" font-size="21" font-weight="400" dominant-baseline="hanging"> -3        18           39</text><text x="1500" y="1175" fill="#e2eef4" font-family="Consola