<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1697" viewBox="0 0 2400 1697"><title>SURVEY / KEEP WORLD FIELDS BLANK</title><rect x="0" y="0" width="2400" height="1697" fill="#0b2235" stroke="none" stroke-width="1"/><text x="72" y="42" fill="#71cfdc" font-family="Consolas" font-size="22" font-weight="400" dominant-baseline="hanging">VALIER CORP  /  PERSONAL DIMENSION</text><text x="72" y="81" fill="#e2eef4" font-family="Segoe UI" font-size="48" font-weight="600" dominant-baseline="hanging">SURVEY / KEEP WORLD FIELDS BLANK</text><text x="72" y="145" fill="#9ebfce" font-family="Segoe UI" font-size="23" font-weight="400" dominant-baseline="hanging">PDIM not created / city-local planning remains valid / complete this sheet only after surveying the intended save</text><line x1="72" y1="185" x2="2328" y2="185" stroke="#284c63" stroke-width="2"/><line x1="72" y1="1578" x2="2328" y2="1578" stroke="#71cfdc" stroke-width="2"/><text x="72" y="1603" fill="#e2eef4" font-family="Consolas" font-size="20" font-weight="400" dominant-baseline="hanging">CITY-LOCAL NW ORIGIN  |  +X EAST  |  +Z SOUTH  |  CIVIL Y0 = FUTURE WALKABLE SURFACE S</text><text x="72" y="1639" fill="#9ebfce" font-family="Consolas" font-size="18" font-weight="400" dominant-baseline="hanging">ALL BOUNDS INCLUSIVE  /  NO WORLD ANCHOR OR SURVEYED Y  /  CIVIL DESIGN, NOT GAME-TESTED</text><text x="2080" y="1599" fill="#71cfdc" font-family="Segoe UI" font-size="38" font-weight="600" dominant-baseline="hanging">P0-01</text><text x="2080" y="1644" fill="#9ebfce" font-family="Consolas" font-size="17" font-weight="400" dominant-baseline="hanging">REV 1 / 2026-11-23</text><text x="100" y="245" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">Intended save / server and dimension ID</text><text x="100" y="292" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">____________________________________________________________</text><line x1="100" y1="339" x2="1390" y2="339" stroke="#284c63" stroke-width="1"/><text x="100" y="393" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">World point corresponding to city-local (0,0)</text><text x="100" y="440" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">World X ____________________   World Z ____________________</text><line x1="100" y1="487" x2="1390" y2="487" stroke="#284c63" stroke-width="1"/><text x="100" y="541" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">Walkable road surface datum S</text><text x="100" y="588" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">World Y ____________________   Measured date ______________</text><line x1="100" y1="635" x2="1390" y2="635" stroke="#284c63" stroke-width="1"/><text x="100" y="689" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">Direction of city +X and city +Z</text><text x="100" y="736" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">City +X ____________________   City +Z ____________________</text><line x1="100" y1="783" x2="1390" y2="783" stroke="#284c63" stroke-width="1"/><text x="100" y="837" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">Required full civil envelope</text><text x="100" y="884" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">876 x 876; last local corner block is X875 Z875, not 876</text><line x1="100" y1="931" x2="1390" y2="931" stroke="#284c63" stroke-width="1"/><text x="100" y="985" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">Lowest permanent civil layer</text><text x="100" y="1032" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">Gallery floor block = S - 10; confirm room above boundary/void</text><line x1="100" y1="1079" x2="1390" y2="1079" stroke="#284c63" stroke-width="1"/><text x="100" y="1133" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">Terrain / overhead / footprint clearance</text><text x="100" y="1180" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">____________________________________________________________</text><line x1="100" y1="1227" x2="1390" y2="1227" stroke="#284c63" stroke-width="1"/><text x="100" y="1281" fill="#71cfdc" font-family="Segoe UI" font-size="30" font-weight="600" dominant-baseline="hanging">Optional outer expansion envelope surveyed?</text><text x="100" y="1328" fill="#e2eef4" font-family="Consolas" font-size="27" font-weight="400" dominant-baseline="hanging">____________________________________________________________</text><line x1="100" y1="1375" x2="1390" y2="1375" stroke="#284c63" stroke-width="1"/><text x="1490" y="245" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Do not infer an anchor</text><text x="1490" y="288" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">User confirmed the intended PDIM has not been created. No world</text><text x="1490" y="322" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">coordinates, surface Y, dimension ID or rotation were supplied.</text><text x="1490" y="384" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Surface vs block level</text><text x="1490" y="427" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">Civil Y0 is the walkable surface S. Road surface blocks are -1; road</text><text x="1490" y="461" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">base -2; gallery roof -4; gallery air -9..-5; floor -10.</text><text x="1490" y="523" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Keep the original city</text><text x="1490" y="566" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">The core remains 864 x 864, city X/ Z0..863. Closing east/ south</text><text x="1490" y="600" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">streets extend the infrastructure to 876 x 876. HQ stays X/ Z405..469,</text><text x="1490" y="634" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">65 x 65.</text><text x="1490" y="696" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Before clearing terrain</text><text x="1490" y="739" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">Use surveyed levels and required-clear runs. Blank parcels and blank</text><text x="1490" y="773" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">work-order grid cells are not excavation instructions.</text><text x="1490" y="835" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Building work is later</text><text x="1490" y="878" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">This pack schedules civil work only. Steam Works v2, all other halls</text><text x="1490" y="912" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">and actual machine/ utility connections are deferred until</text><text x="1490" y="946" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">infrastructure is built.</text><text x="2242" y="62" fill="#e2eef4" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">N</text><line x1="2254" y1="150" x2="2254" y2="94" stroke="#e2eef4" stroke-width="3"/><polygon points="2254,90 2244,108 2264,108" fill="#e2eef4" stroke="none" stroke-width="1"/></svg>