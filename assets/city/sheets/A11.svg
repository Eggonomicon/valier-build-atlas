4205607475" fill="#e4bf7e" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">S02</text><text x="330.69158878504675" y="1191.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">Permanent</text><text x="330.69158878504675" y="1221.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">power expansion</text><text x="330.69158878504675" y="1280.4579439252336" fill="#9ebfce" font-family="Consolas" font-size="15" font-weight="400" dominant-baseline="hanging">X216..407 Z888..1079</text><rect x="999.0654205607476" y="665.233644859813" width="194.39252336448598" height="194.39252336448598" fill="none" stroke="#e4bf7e" stroke-width="2" stroke-dasharray="7 5"/><text x="1011.0654205607476" y="679.233644859813" fill="#e4bf7e" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">E03</text><text x="1011.0654205607476" y="717.233644859813" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">High-tier</text><text x="1011.0654205607476" y="747.233644859813" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">materials</text><text x="1011.0654205607476" y="777.233644859813" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">expansion</text><text x="1011.0654205607476" y="806.626168224299" fill="#9ebfce" font-family="Consolas" font-size="15" font-weight="400" dominant-baseline="hanging">X888..1079 Z420..611</text><rect x="525.233644859813" y="1139.0654205607475" width="194.39252336448598" height="194.39252336448598" fill="none" stroke="#e4bf7e" stroke-width="2" stroke-dasharray="7 5"/><text x="537.233644859813" y="1153.0654205607475" fill="#e4bf7e" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">S03</text><text x="537.233644859813" y="1191.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">UHV+ industry</text><text x="537.233644859813" y="1221.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">expansion</text><text x="537.233644859813" y="1280.4579439252336" fill="#9ebfce" font-family="Consolas" font-size="15" font-weight="400" dominant-baseline="hanging">X420..611 Z888..1079</text><rect x="999.0654205607476" y="871.7757009345794" width="194.39252336448598" height="194.39252336448598" fill="none" stroke="#e4bf7e" stroke-width="2" stroke-dasharray="7 5"/><text x="1011.0654205607476" y="885.7757009345794" fill="#e4bf7e" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">E04</text><text x="1011.0654205607476" y="923.7757009345794" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">Advanced utility/</text><text x="1011.0654205607476" y="953.7757009345794" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">storage</text><text x="1011.0654205607476" y="983.7757009345794" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">expansion</text><text x="1011.0654205607476" y="1013.1682242990655" fill="#9ebfce" font-family="Consolas" font-size="15" font-weight="400" dominant-baseline="hanging">X888..1079 Z624..815</text><rect x="731.7757009345794" y="1139.0654205607475" width="194.39252336448598" height="194.39252336448598" fill="none" stroke="#e4bf7e" stroke-width="2" stroke-dasharray="7 5"/><text x="743.7757009345794" y="1153.0654205607475" fill="#e4bf7e" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">S04</text><text x="743.7757009345794" y="1191.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">Space/</text><text x="743.7757009345794" y="1221.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">late-game</text><text x="743.7757009345794" y="1251.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">expansion</text><text x="743.7757009345794" y="1280.4579439252336" fill="#9ebfce" font-family="Consolas" font-size="15" font-weight="400" dominant-baseline="hanging">X624..815 Z888..1079</text><rect x="999.0654205607476" y="1139.0654205607475" width="388.78504672897196" height="388.78504672897196" fill="none" stroke="#e4bf7e" stroke-width="2" stroke-dasharray="7 5"/><text x="1011.0654205607476" y="1153.0654205607475" fill="#e4bf7e" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">SE-MEGA</text><text x="1011.0654205607476" y="1191.0654205607475" fill="#e2eef4" font-family="Segoe UI" font-size="22" font-weight="400" dominant-baseline="hanging">Future mega-project superplot</text><text x="1011.0654205607476" y="1474.8504672897195" fill="#9ebfce" font-family="Consolas" font-size="15" font-weight="400" dominant-baseline="hanging">X888..1271 Z888..1271</text><text x="2242" y="62" fill="#e2eef4" font-family="Consolas" font-size="26" font-weight="400" dominant-baseline="hanging">N</text><line x1="2254" y1="150" x2="2254" y2="94" stroke="#e2eef4" stroke-width="3"/><polygon points="2254,90 2244,108 2264,108" fill="#e2eef4" stroke="none" stroke-width="1"/><text x="1490" y="240" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Build only the core infrastructure now</text><text x="1490" y="283" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">The current civil model ends at 875. Do not extend streets or</text><text x="1490" y="317" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">galleries into future reservations from these outlines alone.</text><text x="1490" y="379" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Eight outer superplots</text><text x="1490" y="422" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">E01..E04 and S01..S04 each reserve 192 x 192 blocks outside the core,</text><text x="1490" y="456" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">with 12-block separation between the listed bands. Access roads</text><text x="1490" y="490" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">and real machine clearances will be designed later.</text><text x="1490" y="552" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Late-game mega reserve</text><text x="1490" y="595" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">SE-MEGA reserves X/ Z888..1271, 384 x 384. Its size is a planning</text><text x="1490" y="629" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">choice, not a confirmed fusion/ accelerator footprint or a guarantee</text><text x="1490" y="663" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">that the future PDIM supports it.</text><text x="1490" y="725" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Existing age departments stay</text><text x="1490" y="768" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">IV, LuV, ZPM, UV and UHV allocations already in the core are</text><text x="1490" y="802" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">retained. External sites add space; they do not evict the old</text><text x="1490" y="836" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">manufacturing, chemistry or power departments.</text><text x="1490" y="898" fill="#71cfdc" font-family="Segoe UI" font-size="28" font-weight="600" dominant-baseline="hanging">Survey gate</text><text x="1490" y="941" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">Confirm the intended dimension can accommodate the 876 square</text><text x="1490" y="975" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">infrastructure plus desired external reserves before choosing the</text><text x="1490" y="1009" fill="#e2eef4" font-family="Segoe UI" font-size="25" font-weight="400" dominant-baseline="hanging">world anchor. No save currently exists.</text></svg>